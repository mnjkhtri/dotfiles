# -----------------------------------------------------------------------------
# Kitty: restrained visuals, safe clipboard behavior, and low-friction tmux.
# -----------------------------------------------------------------------------

# Typography ------------------------------------------------------------------

font_family JetBrains Mono
font_size 13.0
disable_ligatures always

# Use smooth one-point zoom steps in this window; reset returns to 13 pt.
map ctrl+shift+minus change_font_size current -1.0
map ctrl+shift+equal change_font_size current +1.0
map ctrl+shift+plus change_font_size current +1.0
map ctrl+shift+backspace change_font_size current 0

# Use Bash regardless of the account's configured login shell.
shell /usr/bin/bash
shell_integration enabled

# Theme and window ------------------------------------------------------------

include themes/catppuccin-mocha.conf

window_padding_width 8
hide_window_decorations no
draw_minimal_borders yes
remember_window_size yes
placement_strategy center
confirm_os_window_close -1

# Cursor ----------------------------------------------------------------------

cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15

# Scrollback ------------------------------------------------------------------

scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
map ctrl+shift+h show_scrollback

# Clipboard and paste safety --------------------------------------------------

copy_on_select clipboard
strip_trailing_spaces smart
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
paste_actions quote-urls-at-prompt,confirm

# Terminal behavior -----------------------------------------------------------

enable_audio_bell no
window_alert_on_bell yes
close_on_child_death no
allow_remote_control no

# Handy Kitty-level actions that do not collide with tmux's prefix bindings.
map ctrl+shift+u kitten unicode_input
map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 debug_config
