# -----------------------------------------------------------------------------
# tmux: fast, portable, and useful both locally and over SSH.
# -----------------------------------------------------------------------------

# Prefix ----------------------------------------------------------------------

unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g repeat-time 600

# Terminal capabilities -------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:clipboard:extkeys"
set -s extended-keys on
set -s set-clipboard external
set -g focus-events on

# Sessions and history --------------------------------------------------------

# Keep the default `tmux` command on one persistent named session.
set -s command-alias[100] "new-session=new-session -A -s default"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g history-limit 50000
set -g display-time 3000
set -g status-interval 5
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "tmux: #S:#I.#P #W"

# Use Bash regardless of the account's configured login shell.
set -g default-shell "/usr/bin/bash"

# Windows and panes -----------------------------------------------------------

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r n next-window
bind -r p previous-window
bind -r Tab last-window
bind < swap-window -t -1 \; select-window -t -1
bind > swap-window -t +1 \; select-window -t +1

bind x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill window #W? (y/n)" kill-window
bind z resize-pane -Z

# Mouse and copy mode ---------------------------------------------------------

set -g mouse on
unbind -n MouseDrag1Border

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDown1Pane send -X cancel

# Native power tools ----------------------------------------------------------

unbind t

unbind s

# Prefix+g: disposable shell in the current directory.
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% -T " shell "

# Prefix+e: edit and immediately reload this file after the editor exits.
bind e display-popup -E -w 90% -h 90% -T " tmux.conf " \
    'editor=${VISUAL:-${EDITOR:-vim}}; "$editor" ~/.tmux.conf && tmux source-file ~/.tmux.conf && tmux display-message "Config reloaded"'

# Prefix+M: discoverable command menu.
bind M display-menu -T " tmux " -x C -y C \
    "New window"                 n "new-window -c '#{pane_current_path}'" \
    "Split left/right"           h "split-window -h -c '#{pane_current_path}'" \
    "Split top/bottom"           v "split-window -v -c '#{pane_current_path}'" \
    "Toggle zoom"                z "resize-pane -Z" \
    "Toggle synchronized input" y "set-window-option synchronize-panes" \
    "Rename window"              r "command-prompt -I '#W' 'rename-window -- %1'" \
    "Detach"                     d "detach-client"

bind y set-window-option synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,on,off}"
bind C-l send-keys C-l \; clear-history
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Appearance ------------------------------------------------------------------

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#f9e2af"
set -g mode-style "bg=#89b4fa,fg=#11111b,bold"

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#181825,fg=#a6adc8"

set -g status-left-length 80
set -g status-left "#{?client_prefix,#[bg=#f9e2af]#[fg=#11111b]#[bold] PREFIX ,}#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=#181825,fg=#89b4fa]│"

setw -g window-status-separator ""
setw -g window-status-format "#[bg=#181825,fg=#6c7086] #I:#W#{?window_activity_flag,!,} "
setw -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I:#W#{?window_zoomed_flag, [Z],} "

set -g status-right-length 120
set -g status-right "#{?pane_synchronized,#[bg=#f38ba8]#[fg=#11111b]#[bold] SYNC ,}#[bg=#181825,fg=#89b4fa]#{b:pane_current_path} #[fg=#6c7086]│ #[fg=#f9e2af]load #(cut -d ' ' -f1 /proc/loadavg) #[fg=#6c7086]│ #[fg=#a6e3a1]mem #(free -h | awk 'NR == 2 { print $3 "/" $2 }') #[fg=#6c7086]│ #[fg=#f5c2e7]bat #(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)% #[fg=#6c7086]│ #[fg=#cdd6f4]%Y-%m-%d %H:%M "
