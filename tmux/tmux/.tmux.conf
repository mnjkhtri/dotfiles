# -----------------------------------------------------------------------------
# tmux: fast, portable, and useful both locally and over SSH.
# -----------------------------------------------------------------------------

# Replace the default Ctrl-b prefix with the easier-to-reach Ctrl-a.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Keep repeatable navigation and resize bindings active for 600 ms.
set -g repeat-time 600

# Advertise tmux terminfo inside panes and Kitty features to the tmux server.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:clipboard:extkeys"

set -s extended-keys on
set -s set-clipboard external
set -g focus-events on

# Keep the default `tmux` command on one persistent named session.
set -s command-alias[100] "new-session=new-session -A -s default"

# Number windows and panes from 1, and close numbering gaps automatically.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Switch clients to another session instead of detaching when one is destroyed.
set -g detach-on-destroy off

# Retain generous scrollback and keep status/message updates responsive.
set -g history-limit 50000
set -g display-time 3000
set -g status-interval 5

# Name windows after their active pane's directory, not commands like bash or node.
set -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# Mirror tmux context into the terminal title.
set -g set-titles on
set -g set-titles-string "tmux: #S:#I.#P #W"

# Use Bash regardless of the account's configured login shell.
set -g default-shell "/usr/bin/bash"

# Split in the current directory; replace tmux default split keys.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows in the active pane current directory.
bind c new-window -c "#{pane_current_path}"

# Vim-style pane movement; uppercase variants resize by five cells.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Cycle, revisit, and reorder windows without reaching for number keys.
bind -r n next-window
bind -r p previous-window
bind -r Tab last-window
bind < swap-window -t -1 \; select-window -t -1
bind > swap-window -t +1 \; select-window -t +1

# Confirm destructive pane/window closes and disable tmux pane zoom.
bind x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill window #W? (y/n)" kill-window
unbind z

# Enable mouse selection and scrolling, but prevent accidental border drags.
set -g mouse on
unbind -n MouseDrag1Border

# Use tmux default Emacs-style copy mode without custom selection keys.
setw -g mode-keys emacs

# Remove the default clock, session chooser, and custom command menu.
unbind t
unbind s
unbind M

# Prefix+g: disposable shell in the current directory.
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% -T " shell "

# Leave Ctrl-a y unused; clear pane history or reload this config.
unbind y
bind C-l send-keys C-l \; clear-history
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Catppuccin Mocha colors for pane borders, prompts, and copy mode.
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#f9e2af"
set -g mode-style "bg=#89b4fa,fg=#11111b,bold"

# Keep a left-aligned status bar at the bottom.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#181825,fg=#a6adc8"

# Left side: show PREFIX while active, followed by the session name.
set -g status-left-length 80
set -g status-left "#{?client_prefix,#[bg=#f9e2af]#[fg=#11111b]#[bold] PREFIX ,}#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=#181825,fg=#89b4fa]│"

# Center: show window index and name; ! marks background activity.
setw -g window-status-separator ""
setw -g window-status-format "#[bg=#181825,fg=#6c7086] #I:#W#{?window_activity_flag,!,} "
setw -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I:#W "

# Right side: show the current directory and local date/time.
set -g status-right-length 120
set -g status-right "#[bg=#181825,fg=#89b4fa]#{b:pane_current_path} #[fg=#6c7086]│ #[fg=#cdd6f4]%Y-%m-%d %H:%M "
